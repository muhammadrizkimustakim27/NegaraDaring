<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negara Daring - Republik Digital Indonesia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col pb-24 bg-[#E0F2FE]">
  <header class="sticky top-0 z-50 px-4 py-3 bg-[#E0F2FE]/95 backdrop-blur-md border-b border-white/60 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-md ring-2 ring-sky-300">🇮🇩</div>
      <div>
        <h1 class="font-display font-bold text-base text-slate-800">Negara Daring</h1>
        <p class="text-[10px] text-sky-700 font-medium" id="headerOnlineCount">🟢 0 Online</p>
      </div>
    </div>
    <button onclick="openAuthModal()" id="btnLogin" class="civic-btn px-3 py-2 bg-sky-500 text-white font-bold text-xs rounded-xl">🔐 Masuk</button>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-5">
    <section id="tab-beranda" class="space-y-5">
      <div class="civic-card p-5 text-center space-y-3">
        <h2 class="font-display text-2xl font-bold text-slate-800">Selamat Datang di Negara Daring! 🇮🇩</h2>
        <p class="text-sm text-slate-600">Silakan login untuk mulai mencetak KTP, membangun rumah, dan chatting dengan warga lain.</p>
        <div class="flex justify-center gap-3 pt-2">
          <button onclick="switchTab('ktp')" class="civic-btn px-4 py-2 bg-sky-500 text-white font-bold text-xs rounded-xl">🪪 Cetak KTP</button>
          <button onclick="switchTab('chat')" class="civic-btn px-4 py-2 bg-purple-500 text-white font-bold text-xs rounded-xl">💬 Chat Warga</button>
        </div>
      </div>
    </section>

    <section id="tab-ktp" class="space-y-5 hidden">
      <div class="civic-card p-5 space-y-4">
        <h2 class="font-display text-xl font-bold text-slate-800">🪪 Cetak KTP Sipil</h2>
        <input type="text" id="inpKtpName" placeholder="Nama Lengkap" class="w-full px-3 py-2 text-xs rounded-xl">
        <select id="inpKtpGender" class="w-full px-3 py-2 text-xs rounded-xl">
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
        <button onclick="registerCitizenKtp()" class="civic-btn w-full py-2 bg-sky-500 text-white font-bold text-xs rounded-xl">Simpan KTP</button>
        <div id="ktpPreviewBox" class="hidden clay-subcard p-4 border-2 border-sky-300 rounded-xl">
          <h3 id="ktpCardName" class="font-bold text-lg">-</h3>
          <p>NIK: <b id="ktpCardNik">-</b></p>
        </div>
      </div>
    </section>

    <section id="tab-chat" class="space-y-5 hidden">
      <div class="civic-card p-5 space-y-4">
        <h2 class="font-display text-xl font-bold text-slate-800">💬 Chat Warga</h2>
        <div id="chatMessages" class="clay-subcard p-3 h-64 overflow-y-auto bg-white rounded-xl space-y-2"></div>
        <div class="flex space-x-2">
          <input type="text" id="chatInput" placeholder="Ketik pesan..." class="flex-1 px-3 py-2 text-xs rounded-xl" onkeypress="if(event.key==='Enter')sendChatMessage()">
          <button onclick="sendChatMessage()" class="civic-btn px-4 py-2 bg-purple-500 text-white font-bold text-xs rounded-xl">Kirim</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-50 px-2 py-2 bg-white/95 backdrop-blur-md border-t flex justify-around shadow-lg">
    <button onclick="switchTab('beranda')" class="nav-item active flex flex-col items-center text-[10px] font-bold p-2 rounded-xl">🏛️<br>Beranda</button>
    <button onclick="switchTab('ktp')" class="nav-item flex flex-col items-center text-[10px] font-bold p-2 rounded-xl">🪪<br>KTP</button>
    <button onclick="switchTab('chat')" class="nav-item flex flex-col items-center text-[10px] font-bold p-2 rounded-xl">💬<br>Chat</button>
  </nav>

  <div id="modalContainer" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
    <div class="civic-card p-5 max-w-sm w-full space-y-4 relative rounded-2xl">
      <button onclick="closeModal()" class="absolute top-3 right-3 font-bold">✕</button>
      <div id="modalContentBody"></div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
